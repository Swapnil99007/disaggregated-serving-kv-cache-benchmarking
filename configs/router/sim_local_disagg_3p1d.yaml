# Disaggregated prefill/decode with a prefill-heavy split: 3 prefill + 1 decode.
# Same 4 "GPUs" as sim_local.yaml / sim_local_disagg.yaml, so all three are iso-hardware.
# Long RAG prompts + short answers make this workload prefill-bound, so shifting capacity
# from decode to prefill should cut TTFT versus 2P+2D (the P:D ratio question from
# DistServe / Splitwise).
#   kvbench cluster --config configs/router/sim_local_disagg_3p1d.yaml --set speed=4
#   kvbench bench --experiment configs/experiments/sim_disagg.yaml --deployment sim-disagg-3p1d --name sim_disagg_3p1d
model: kvbench-model
mode: disagg
policy: cache_aware
decode_policy: least_loaded
chunk_chars: 256
chars_per_token: 5.0
index_capacity_tokens: 131072
scrape_interval_s: 0.5
port: 8000
policy_params:
  cache_aware: {prefill_tps: 10000, decode_cost_s: 0.0, mem_high_watermark: 0.9, mem_penalty_s: 1.0, imbalance_abs: 8, imbalance_rel: 1.5}
  prefix_affinity: {key_chunks: 16}
workers:
  - {name: p0, url: "http://localhost:9101", backend: sim, role: prefill, sim_config: configs/sim/default.yaml}
  - {name: p1, url: "http://localhost:9102", backend: sim, role: prefill, sim_config: configs/sim/default.yaml}
  - {name: p2, url: "http://localhost:9103", backend: sim, role: prefill, sim_config: configs/sim/default.yaml}
  - {name: d0, url: "http://localhost:9201", backend: sim, role: decode,  sim_config: configs/sim/default.yaml}
