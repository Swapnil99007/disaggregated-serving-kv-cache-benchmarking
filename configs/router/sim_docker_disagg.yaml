# Disaggregated prefill/decode with simulated workers: 2 prefill + 2 decode.
# Same total "GPU" count as sim_local.yaml, so the comparison is iso-hardware.
model: kvbench-model
mode: disagg
policy: cache_aware               # picks the PREFILL worker (where prefix reuse saves compute)
decode_policy: least_loaded       # picks the DECODE worker
chunk_chars: 256
chars_per_token: 5.0
index_capacity_tokens: 131072
scrape_interval_s: 0.5
port: 8000
policy_params:
  cache_aware: {prefill_tps: 10000, decode_cost_s: 0.0, mem_high_watermark: 0.9, mem_penalty_s: 1.0, imbalance_abs: 8, imbalance_rel: 1.5}
  prefix_affinity: {key_chunks: 16}
workers:
  - {name: p0, url: "http://prefill0:9000", backend: sim, role: prefill, sim_config: configs/sim/default.yaml}
  - {name: p1, url: "http://prefill1:9000", backend: sim, role: prefill, sim_config: configs/sim/default.yaml}
  - {name: d0, url: "http://decode0:9000", backend: sim, role: decode,  sim_config: configs/sim/default.yaml}
  - {name: d1, url: "http://decode1:9000", backend: sim, role: decode,  sim_config: configs/sim/default.yaml}
