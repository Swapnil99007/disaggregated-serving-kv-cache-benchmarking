# 4 colocated simulated workers on localhost. Start everything with:
#   kvbench cluster --config configs/router/sim_local.yaml
model: kvbench-model
mode: colocated
policy: cache_aware
chunk_chars: 256
chars_per_token: 5.0              # sim tokenizer ~ words+punctuation; real BPE tokenizers ~ 4
index_capacity_tokens: 131072     # should match the workers' KV capacity
index_ttl_s: 600
scrape_interval_s: 0.5
port: 8000
policy_params:
  cache_aware:
    prefill_tps: 10000            # router's estimate of one worker's prefill throughput
    decode_cost_s: 0.005
    mem_high_watermark: 0.9
    mem_penalty_s: 1.0
    imbalance_abs: 8
    imbalance_rel: 1.5
  prefix_affinity:
    key_chunks: 16                # ~4 KB of leading text = system prompt + first retrieved doc
  weighted:
    w_hit: 0.5
    w_queue: 0.3
    w_mem: 0.2
workers:
  - {name: w0, url: "http://localhost:9001", backend: sim, role: both, sim_config: configs/sim/default.yaml}
  - {name: w1, url: "http://localhost:9002", backend: sim, role: both, sim_config: configs/sim/default.yaml}
  - {name: w2, url: "http://localhost:9003", backend: sim, role: both, sim_config: configs/sim/default.yaml}
  - {name: w3, url: "http://localhost:9004", backend: sim, role: both, sim_config: configs/sim/default.yaml}
