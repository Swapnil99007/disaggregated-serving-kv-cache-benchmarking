# vLLM 1 prefill + 1 decode (NixlConnector) on 2 GPUs: 1,000 prompts x 8-64 sessions x 3 repeats.
# Launch: scripts/vllm_disagg_baremetal.sh (walkthrough: docs/RUN_DISAGG_2GPU.md).
# Compare with the colocated run on the SAME 2 GPUs (configs/experiments/vllm_2gpu.yaml):
#   kvbench analyze results/vllm_2gpu/<ts> results/vllm_disagg/<ts> --baseline vllm-2gpu-2w/cache_aware
name: vllm_disagg
deployment: vllm-disagg-1p1d
router_url: http://localhost:8000
model: kvbench-model
trace:
  path: traces/rag_1000.jsonl
  workload: configs/workloads/rag_default.yaml
policies: [cache_aware]            # prefill-side policy; decode side uses decode_policy below
decode_policy: least_loaded
concurrency: [8, 16, 24, 32, 48, 64]
repeats: 3
warmup: {engine_requests: 16, prefix_warmup_prompts: 0}
flush_between_runs: true
request: {ignore_eos: true, temperature: 0.0, timeout_s: 900}
telemetry: {interval_s: 0.5, nvml: true}
ready_timeout_s: 1800              # first start downloads weights + compiles CUDA graphs
output_dir: results
analysis: {baseline_policy: cache_aware, slo_metric: e2e, slo_percentile: 95, slo_target_s: null, chunk_chars: 256}
