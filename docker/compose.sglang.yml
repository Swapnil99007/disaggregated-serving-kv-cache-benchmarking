# Real SGLang data-parallel replicas behind the kvbench router.
# SGLang sizes memory relative to the WHOLE GPU, so two replicas on one GPU need asymmetric
# fractions (defaults below: 0.40 then 0.80, started sequentially). With one GPU per replica,
# set SGL0_GPU=0 SGL1_GPU=1 and both fractions to ~0.85. Pin the KV pool with
# SGLANG_EXTRA_ARGS="--max-total-tokens 131072" so replicas have equal cache capacity.
#   docker compose -f docker/compose.sglang.yml --env-file .env up --build -d
#   kvbench bench --experiment configs/experiments/sglang.yaml
name: kvbench-sglang

x-sglang: &sglang
  image: ${SGLANG_IMAGE:-lmsysorg/sglang:latest}
  ipc: host
  environment:
    HF_TOKEN: ${HF_TOKEN:-}
  volumes:
    - ${HF_CACHE_DIR:-~/.cache/huggingface}:/root/.cache/huggingface
  healthcheck:
    test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
    interval: 10s
    timeout: 5s
    retries: 90
    start_period: 60s
  restart: unless-stopped

services:
  sglang0:
    <<: *sglang
    ports: ["8001:8000"]
    command: >-
      python3 -m sglang.launch_server --model-path ${MODEL:-Qwen/Qwen2.5-1.5B-Instruct}
      --host 0.0.0.0 --port 8000 --served-model-name kvbench-model
      --mem-fraction-static ${SGL0_MEM_FRACTION:-0.40}
      --context-length ${MAX_MODEL_LEN:-16384} --max-running-requests ${MAX_NUM_SEQS:-64}
      --schedule-policy ${SGL_SCHEDULE_POLICY:-fcfs}
      --enable-metrics --enable-cache-report
      ${SGLANG_EXTRA_ARGS:-}
    deploy:
      resources:
        reservations:
          devices: [{driver: nvidia, device_ids: ["${SGL0_GPU:-0}"], capabilities: [gpu]}]

  sglang1:
    <<: *sglang
    ports: ["8002:8000"]
    depends_on: {sglang0: {condition: service_healthy}}
    command: >-
      python3 -m sglang.launch_server --model-path ${MODEL:-Qwen/Qwen2.5-1.5B-Instruct}
      --host 0.0.0.0 --port 8000 --served-model-name kvbench-model
      --mem-fraction-static ${SGL1_MEM_FRACTION:-0.80}
      --context-length ${MAX_MODEL_LEN:-16384} --max-running-requests ${MAX_NUM_SEQS:-64}
      --schedule-policy ${SGL_SCHEDULE_POLICY:-fcfs}
      --enable-metrics --enable-cache-report
      ${SGLANG_EXTRA_ARGS:-}
    deploy:
      resources:
        reservations:
          devices: [{driver: nvidia, device_ids: ["${SGL1_GPU:-0}"], capabilities: [gpu]}]

  router:
    image: kvbench:latest
    build: {context: .., dockerfile: docker/Dockerfile}
    volumes: ["../configs:/app/configs:ro"]
    command: [router, --config, "${ROUTER_CONFIG:-configs/router/sglang.yaml}", --host, 0.0.0.0, --port, "8000"]
    ports: ["8000:8000"]
    restart: unless-stopped

  bench:
    profiles: [bench]
    image: kvbench:latest
    depends_on: [router]
    volumes: ["../configs:/app/configs:ro", "../results:/app/results", "../traces:/app/traces"]
    command: [bench, --experiment, "${EXPERIMENT:-configs/experiments/sglang.yaml}", --router-url, "http://router:8000"]
    deploy:
      resources:
        reservations:
          devices: [{driver: nvidia, count: all, capabilities: [gpu]}]
