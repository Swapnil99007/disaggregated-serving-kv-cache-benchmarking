# Real vLLM data-parallel replicas behind the kvbench router (colocated prefill+decode per replica).
# Default: 2 replicas sharing GPU 0 (each gets GPU_MEM_UTIL of it). Needs the NVIDIA container toolkit.
#   cp .env.example .env    # edit MODEL / GPU settings
#   docker compose -f docker/compose.vllm.yml --env-file .env up --build -d
#   docker compose -f docker/compose.vllm.yml --env-file .env --profile x4 up -d     # 4 replicas (set ROUTER_CONFIG)
#   kvbench bench --experiment configs/experiments/vllm.yaml
name: kvbench-vllm

x-vllm: &vllm
  image: ${VLLM_IMAGE:-vllm/vllm-openai:v0.11.0}
  entrypoint: ["vllm", "serve"]
  ipc: host
  environment:
    HF_TOKEN: ${HF_TOKEN:-}
    VLLM_SERVER_DEV_MODE: "1"            # exposes POST /reset_prefix_cache for cold-cache runs
  volumes:
    - ${HF_CACHE_DIR:-~/.cache/huggingface}:/root/.cache/huggingface
  healthcheck:
    test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
    interval: 10s
    timeout: 5s
    retries: 90
    start_period: 60s
  restart: unless-stopped
  command: >-
    ${MODEL:-Qwen/Qwen2.5-1.5B-Instruct}
    --host 0.0.0.0 --port 8000 --served-model-name kvbench-model
    --gpu-memory-utilization ${GPU_MEM_UTIL:-0.40}
    --max-model-len ${MAX_MODEL_LEN:-16384}
    --max-num-seqs ${MAX_NUM_SEQS:-64}
    --enable-prefix-caching --enable-prompt-tokens-details
    ${VLLM_EXTRA_ARGS:-}

services:
  vllm0:
    <<: *vllm
    ports: ["8001:8000"]
    deploy:
      resources:
        reservations:
          devices: [{driver: nvidia, device_ids: ["${VLLM0_GPU:-0}"], capabilities: [gpu]}]

  vllm1:
    <<: *vllm
    ports: ["8002:8000"]
    depends_on: {vllm0: {condition: service_healthy}}   # sequential start: memory profiling must not overlap
    deploy:
      resources:
        reservations:
          devices: [{driver: nvidia, device_ids: ["${VLLM1_GPU:-0}"], capabilities: [gpu]}]

  vllm2:
    <<: *vllm
    profiles: [x4]
    ports: ["8003:8000"]
    depends_on: {vllm1: {condition: service_healthy}}
    deploy:
      resources:
        reservations:
          devices: [{driver: nvidia, device_ids: ["${VLLM2_GPU:-0}"], capabilities: [gpu]}]

  vllm3:
    <<: *vllm
    profiles: [x4]
    ports: ["8004:8000"]
    depends_on: {vllm2: {condition: service_healthy}}
    deploy:
      resources:
        reservations:
          devices: [{driver: nvidia, device_ids: ["${VLLM3_GPU:-0}"], capabilities: [gpu]}]

  router:
    image: kvbench:latest
    build: {context: .., dockerfile: docker/Dockerfile}
    volumes: ["../configs:/app/configs:ro"]
    command: [router, --config, "${ROUTER_CONFIG:-configs/router/vllm.yaml}", --host, 0.0.0.0, --port, "8000"]
    ports: ["8000:8000"]
    restart: unless-stopped

  bench:
    profiles: [bench]
    image: kvbench:latest
    depends_on: [router]
    volumes: ["../configs:/app/configs:ro", "../results:/app/results", "../traces:/app/traces"]
    command: [bench, --experiment, "${EXPERIMENT:-configs/experiments/vllm.yaml}", --router-url, "http://router:8000"]
    deploy:
      resources:
        reservations:
          devices: [{driver: nvidia, count: all, capabilities: [gpu]}]   # NVML GPU-memory telemetry
